services:
  - type: web
    name: stylepilot-ai-agent
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: TAVILY_API_KEY
        sync: false
